<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки для запоминания формул</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-brain"></i> Карточки формул по физике</h1>
            <div class="controls">
                <button id="toggleMode" class="btn">
                    <i class="fas fa-exchange-alt"></i> Режим: Название → Формула
                </button>
                <button id="reset" class="btn secondary">
                    <i class="fas fa-redo"></i> Начать заново
                </button>
                <div class="stats">
                    <span id="score">0</span> из <span id="total">0</span>
                </div>
            </div>
        </header>

        <main>
            <div class="card-container">
                <div class="card">
                    <div class="question-container">
                        <div id="question" class="question"></div>
                    </div>
                    
                    <div class="answers-container">
                        <div class="answers-grid">
                            <div class="answer-option" data-index="0">
                                <div class="answer-content"></div>
                            </div>
                            <div class="answer-option" data-index="1">
                                <div class="answer-content"></div>
                            </div>
                            <div class="answer-option" data-index="2">
                                <div class="answer-content"></div>
                            </div>
                            <div class="answer-option" data-index="3">
                                <div class="answer-content"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="feedback" id="feedback"></div>
                    
                    <button id="nextBtn" class="btn primary" disabled>
                        <i class="fas fa-arrow-right"></i> Следующая карточка
                    </button>
                </div>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Прогресс: 0/0</div>
            </div>
        </main>
        
        <footer>
            <p>Создано для изучения формул по физике</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
